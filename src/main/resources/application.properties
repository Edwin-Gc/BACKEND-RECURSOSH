# Conexión a MySQL en AlwaysData usando variables de entorno
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configuración del servidor Spring Boot
server.address=${SERVER_ADDRESS:0.0.0.0}  # usa 0.0.0.0 por defecto
server.port=${SERVER_PORT:8080}           # usa 8080 por defecto
